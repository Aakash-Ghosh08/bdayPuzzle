<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">Crossroads puzzle image</title>
  <desc id="desc">A stylized crossword grid with numbered clue entries.</desc>
  <rect width="520" height="320" fill="#f7f5f2" rx="16"/>

  <!-- Across 2 -->
  <rect x="20" y="80" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="68" y="80" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="116" y="80" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="164" y="80" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <text x="28" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">2</text>

  <!-- Vertical 1 -->
  <rect x="220" y="20" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="220" y="68" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="220" y="116" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="220" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <text x="228" y="46" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">1</text>

  <!-- Across 4 -->
  <rect x="132" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="180" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="228" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="276" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <text x="140" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">4</text>

  <!-- Across 5 -->
  <rect x="276" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="324" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="372" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="420" y="164" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <text x="284" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">5</text>

  <!-- Down 3 -->
  <rect x="324" y="212" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="324" y="260" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <text x="332" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">3</text>

  <!-- Across 6 -->
  <rect x="84" y="260" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="132" y="260" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="180" y="260" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="228" y="260" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <rect x="276" y="260" width="44" height="44" fill="#ffffff" stroke="#222" stroke-width="2" />
  <text x="92" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">6</text>

  <!-- Grid numbers and label text -->
  <text x="20" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">Across: 2, 4, 6</text>
  <text x="20" y="320" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222">Down: 1, 3, 5</text>
</svg>
